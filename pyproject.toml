[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "android_controller"
version = "0.1.0"
description = "Appium-style Android device control over ADB or on-device root (Termux su)."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "muhammad"}]
dependencies = []

[tool.setuptools.packages.find]
include = ["android_controller*"]
